<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <a href="jerely">
            <div class="logo">
                <div class="img"><img src="borcelle.png" alt=""></div>
            </div>
        </a>
        @if (!authStore.await_code()){
            <div class="formulaire">
                <div class="titre"><h1>S'inscrire</h1></div>
                <div class="forms">
                    <form [formGroup]="form" (ngSubmit)="submit()">
                        <div class="input">
                            <input type="email" placeholder="votre email..." formControlName="email">
                        </div>
                         @if (authStore.isLoading()) {
                            <mat-spinner class="white-spinner" [diameter]="30" [strokeWidth]="5"></mat-spinner>
                         }@else {
                            <button type="submit">Continuer</button>
                         }
                        
                    </form>
                </div>
                <!-- <div class="btn">
                    <a>Continuer avec google <img src="google.png" alt="logo google"></a>
                </div> -->
                <hr>
                @if(!authStore.isLoading()){
                    <div class="btn">
                        <div #googleBtn></div>
                    </div>
                }

                <p>vous avez déjà un compte? <a href="jerely/login"> Se connecter</a></p>
                @if(authStore.isError()){
                    <p class="erreur">{{authStore.error()}}</p>
                }
            </div>
        }@else {
            <app-validationcode></app-validationcode>
        }
    </main>
</body>
</html>
