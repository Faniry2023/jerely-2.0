<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <a href="jerely">
            <div class="logo">
                <div class="img"><img src="borcelle.png" alt=""></div>
            </div>
        </a>
        <div class="formulaire">
            <div class="titre"><h1>S'inscrire</h1></div>
            <div class="forms">
                <form action="">
                    <div class="input">
                        <input type="email" placeholder="votre email...">
                    </div>
                    <div class="input">
                        <div class="mdp">
                            <input [type]="pasShwo() ? 'text' : 'password'" placeholder="votre mot de passe...">
                            @if (!pasShwo()) {
                                <img class="icon" src="o-bb.png" alt="" (click)="pasShwo.set(!pasShwo())">
                            }@else {
                                <img class="icon" src="o-b.png" alt="" (click)="pasShwo.set(!pasShwo())">
                            }
                        </div>
                    </div>
                    <div class="input">
                        <div class="mdp">
                            <input type="password" placeholder="Confirmer votre mot de passe...">
                        </div>
                    </div>
                </form>
            </div>
            <p>vous avez déjà un compte? <a href="jerely/login"> Se connecter</a></p>
        </div>
    </main>
</body>
</html>
