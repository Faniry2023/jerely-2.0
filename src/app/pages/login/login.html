<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <a href="jerely">
            <div class="logo">
                <div class="img"><img src="borcelle.png" alt=""></div>
            </div>
        </a>
        @if (!authStore.await_code()) {
            <div class="formulaire">
                <div class="titre"><h1>Connexion</h1></div>
                <form  [formGroup]="form" (ngSubmit)="submit()">
                    <div class="input">
                        <input type="email" placeholder="votre email..." formControlName="email">
                    </div>
                    <div class="check">
                        <input id="svn" type="checkbox" >
                        <label for="svn">Se souvenir de moi</label>
                    </div>
                    @if (authStore.isLoading()) {
                        <mat-spinner class="white-spinner" [diameter]="30" [strokeWidth]="5"></mat-spinner>
                    }@else {
                        <button  type="submit">Continuer</button>
                    }
                    
                    
                </form>
                <hr>
                @if(!authStore.isLoading()){
                    <div class="btn">
                        <div #googleBtn></div>
                    </div>
                }

                <p>vous n'avez pas de compte? <a href="jerely/register"> Creer un compte</a></p>
                @if(authStore.isError()){
                    <p class="erreur">{{authStore.error()}}</p>
                }
            </div>
        }
        @else {
            <app-validationcode></app-validationcode>
        }
    </main>
</body>
</html>
